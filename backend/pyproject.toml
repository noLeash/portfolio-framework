[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "gcomollo-backend"
version = "0.1.0"
description = "FastAPI backend for gcomollo"
requires-python = ">=3.12"
dependencies = [
    "fastapi[standard]==0.135.2",
    "pydantic==2.12.5",
    "SQLAlchemy==2.0.48",
    "alembic==1.18.4",
    "psycopg[binary]==3.3.3",
    "passlib==1.7.4",
    "bcrypt==5.0.0",
    "PyJWT==2.12.1",
    "python-dotenv==1.2.2",
]

[project.optional-dependencies]
notebook = [
    "jupyterlab==4.*",
    "notebook==7.*",
    "ipykernel",
    "requests",
]

# The app runs from /backend via PYTHONPATH rather than as an installed package,
# so `pip install .` only installs the dependencies above.
[tool.setuptools]
packages = []
py-modules = []
